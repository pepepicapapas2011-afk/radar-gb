# GitHub pausa las tareas programadas de repositorios sin actividad por 60 días. Esto hace un commit vacío cada mes.
name: Mantener activo
on:
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "radar-gbm-bot"
          git config user.email "radar-gbm-bot@users.noreply.github.com"
          git commit --allow-empty -m "Mantener activas las tareas programadas"
          git push
