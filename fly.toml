# Despliegue en Fly.io:  fly launch --no-deploy --copy-config ; fly volumes create radar_data --size 1 ; fly secrets set ... ; fly deploy
app = "radar-gbm"
primary_region = "dfw"

[build]

[env]
  DATABASE_PATH = "/data/radar.db"
  PORT = "8000"
  ENABLE_INTERNAL_SCHEDULER = "1"

[[mounts]]
  source = "radar_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # siempre encendida para que el programador interno corra a las 7:00
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
